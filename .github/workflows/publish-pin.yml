name: Auto-publish Pinterest pin

on:
  schedule:
    # Runs daily at 14:00 UTC (10:00 AM EST / 7:00 PM PKT).
    # Cron format: minute hour day month weekday
    - cron: "0 14 * * *"
  workflow_dispatch: {}   # Enables manual 'Run workflow' trigger in GitHub Actions tab

permissions:
  contents: write   # Required to commit updated pins.csv back to the repository

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publish next pin
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
        run: python publish_pin.py

      - name: Commit updated pins.csv
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pins.csv
          if ! git diff --cached --quiet; then
            git commit -m "Auto-post: update pin status [skip ci]"
            git pull --rebase origin main || git pull --rebase
            git push origin HEAD:main || git push
          else
            echo "No changes in pins.csv to commit."
          fi
